name: test merge sha

on:
  pull_request:
    branches:
      - "bantic/test-merge-sha-*"

jobs:
  check-file:
    runs-on: ubuntu-latest

    steps:
      - name: base (branch)
        uses: actions/checkout@v4.2.2
        with:
          path: base-branch
          ref: bantic/test-merge-sha-base
      - name: base (event)
        uses: actions/checkout@v4.2.2
        with:
          path: base-event
          ref: ${{ github.event.pull_request.base.sha }}
      - name: head
        uses: actions/checkout@v4.2.2
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha }}
      - name: sha
        uses: actions/checkout@v4.2.2
        with:
          path: sha
          ref: ${{ github.sha }}
      - name: Cat files
        run: |
          echo "base-branch"
          cat base-branch/test-merge-sha
          echo "base-sha"
          cat base-sha/test-merge-sha
          echo "head"
          cat head/test-merge-sha
          echo "sha"
          cat sha/test-merge-sha
