name: Dump GitHub Context

on:
  push:
  pull_request:

jobs:
  dump-context:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code
      - name: Check out code
        uses: actions/checkout@v3

      # Step 2: Dump the GitHub context as JSON
      - name: Dump GitHub Context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT" > github-context.json && cat github-context.json
